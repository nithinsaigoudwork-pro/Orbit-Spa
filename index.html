<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Student Dev Space</title>
  <meta name="description" content="Orbit is a single page application demo that loads content dynamically without full page reloads." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Skip link for accessibility -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">

    <header class="app-header">
      <a href="/" class="brand" data-link>
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Orbit</span>
      </a>

      <nav class="main-nav" aria-label="Primary">
        <ul id="nav-list" class="nav-list">
          <li><a href="/" data-link data-route="home">Home</a></li>
          <li><a href="/projects" data-link data-route="projects">Projects</a></li>
          <li><a href="/skills" data-link data-route="skills">Skills</a></li>
          <li><a href="/contact" data-link data-route="contact">Contact</a></li>
        </ul>
        <div class="nav-indicator" id="nav-indicator" aria-hidden="true"></div>
      </nav>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div class="route-progress" id="route-progress" aria-hidden="true"></div>

    <main id="main-content" class="app-main" tabindex="-1">
      <!-- Dynamic route content is injected here by js/app.js -->
      <div id="view" class="view" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
      <span class="crumb" id="breadcrumb">/ home</span>
      <span class="footer-note">Orbit SPA demo &mdash; client-side routed, no full page reloads</span>
    </footer>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
